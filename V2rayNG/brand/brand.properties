# =============================================================================
#  TONIC — Single source of truth for re-branding
# =============================================================================
#  Change the values below and rebuild. Nothing else needs editing to
#  produce a differently-branded build (name, package id, backend, colors,
#  behaviour flags). See docs/REBRAND.md for the full checklist (logo assets
#  live outside this file because they are binary images).
# -----------------------------------------------------------------------------

# Visible application name (launcher label, notifications, about screen).
BRAND_APP_NAME=TONIC

# Name shown on the Quick-Settings tile.
BRAND_TILE_NAME=TONIC

# Android application id (package name on the device / Play Console).
# Must be unique per brand. Use only lowercase letters, digits and dots.
BRAND_APPLICATION_ID=com.tonic.vpn

# Base URL of the authentication / subscription backend (no trailing slash).
# 10.0.2.2 is the host machine's "localhost" as seen from the Android emulator,
# so this default works out-of-the-box with the bundled FastAPI backend.
BRAND_BACKEND_URL=http://10.0.2.2:8000

# Support / help link opened from the app menu (Telegram, website, ...).
BRAND_SUPPORT_URL=https://t.me/your_brand_channel

# How often (in hours) the app refreshes subscriptions in the background.
BRAND_SUB_UPDATE_HOURS=12

# Private-client lockdown. When true the app refuses every add / import /
# export / share / QR path even if some UI ever reaches it (defence in depth).
BRAND_LOCK_DOWN=true

# Show the optional "choose location" list on the main screen.
# When false the app is a single auto-connect button with no server picker.
BRAND_ALLOW_LOCATION_PICKER=true

# ---- Theme colors (ARGB or RGB hex, e.g. #FF9800) -------------------------
# Primary accent (buttons, highlights, logo tint).
BRAND_COLOR_PRIMARY=#FF7A18
# Darker primary variant (status bar, pressed states).
BRAND_COLOR_PRIMARY_DARK=#C85A00
# Color of the connect button / status when CONNECTED.
BRAND_COLOR_CONNECTED=#2ECC71
# Color of the connect button when DISCONNECTED / idle.
BRAND_COLOR_DISCONNECTED=#455A64
# App background (dark theme base).
BRAND_COLOR_BACKGROUND=#0E1116
# Card / surface background.
BRAND_COLOR_SURFACE=#1A1F27
